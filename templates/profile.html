{% extends "base.html" %}

{% block title %}My Profile – {{ STORE_NAME }} Cafe{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="mb-4 pb-2 border-bottom d-flex align-items-center justify-content-between">
    <div>
      <h1 class="h2 fw-bold text-dark mb-1">Account & Profile</h1>
      <p class="text-muted small mb-0">Manage your contact details, saved delivery address, and security.</p>
    </div>
    <a href="{{ url_for('orders.my_orders') }}" class="btn btn-loozy-light">
      <i class="bi bi-receipt me-1"></i> View Order History
    </a>
  </div>

  <div class="row g-4">
    <!-- Left: Update Profile Info -->
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h4 class="fw-bold text-dark mb-3"><i class="bi bi-person-lines-fill text-success me-2"></i>Personal Details</h4>

        <form action="{{ url_for('auth.profile') }}" method="POST">
          <input type="hidden" name="action" value="update_profile">

          <div class="mb-3">
            <label for="name" class="form-label fw-semibold small text-secondary">Full Name</label>
            <input type="text" class="form-control py-2" id="name" name="name" value="{{ user.name }}" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small text-secondary">Email Address (Read-only)</label>
            <input type="email" class="form-control py-2 bg-light text-muted" id="email" value="{{ user.email }}" readonly>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label fw-semibold small text-secondary">Phone Number</label>
            <input type="tel" class="form-control py-2" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="+91 98765 43210">
          </div>

          <div class="mb-4">
            <label for="address" class="form-label fw-semibold small text-secondary">Default Delivery Address</label>
            <textarea class="form-control py-2" id="address" name="address" rows="3" placeholder="Apartment / House number, street, city, pin code">{{ user.address or '' }}</textarea>
          </div>

          <button type="submit" class="btn btn-loozy-primary">
            <i class="bi bi-check2-circle me-1"></i> Save Changes
          </button>
        </form>
      </div>
    </div>

    <!-- Right: Change Password -->
    <div class="col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h4 class="fw-bold text-dark mb-3"><i class="bi bi-shield-lock text-success me-2"></i>Security Settings</h4>

        <form action="{{ url_for('auth.profile') }}" method="POST">
          <input type="hidden" name="action" value="change_password">

          <div class="mb-3">
            <label for="old_password" class="form-label fw-semibold small text-secondary">Current Password</label>
            <input type="password" class="form-control py-2" id="old_password" name="old_password" required>
          </div>

          <div class="mb-3">
            <label for="new_password" class="form-label fw-semibold small text-secondary">New Password</label>
            <input type="password" class="form-control py-2" id="new_password" name="new_password" placeholder="At least 6 characters" required>
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label fw-semibold small text-secondary">Confirm New Password</label>
            <input type="password" class="form-control py-2" id="confirm_password" name="confirm_password" required>
          </div>

          <button type="submit" class="btn btn-loozy-outline w-100">
            <i class="bi bi-key-fill me-1"></i> Update Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
