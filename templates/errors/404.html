{% extends "base.html" %}

{% block title %}404 – Page Not Found – {{ STORE_NAME }} Cafe{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="category-icon-circle mx-auto mb-4" style="width: 100px; height: 100px; font-size: 3rem; background: var(--loozy-primary-light);">
    <i class="bi bi-compass text-success"></i>
  </div>
  <h1 class="display-3 fw-bolder text-dark mb-2 brand-font">404</h1>
  <h2 class="fw-bold text-dark mb-3">Oops! Recipe Not Found</h2>
  <p class="text-muted mx-auto fs-5 mb-4" style="max-width: 500px;">
    The page you are looking for might have been moved, renamed, or is currently taking a coffee break.
  </p>
  <div class="d-flex justify-content-center gap-3">
    <a href="{{ url_for('main.index') }}" class="btn btn-loozy-primary px-4 py-3">
      <i class="bi bi-house-door-fill me-1"></i> Back to Home
    </a>
    <a href="{{ url_for('products.menu') }}" class="btn btn-loozy-outline px-4 py-3">
      <i class="bi bi-grid-fill me-1"></i> Explore Menu
    </a>
  </div>
</div>
{% endblock %}
