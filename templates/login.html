{% extends "base.html" %}

{% block title %}Login – {{ STORE_NAME }} Cafe{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <!-- Logo Header -->
        <div class="text-center mb-4">
          <span class="loozy-logo-badge mb-2 mx-auto" style="width: 48px; height: 48px; font-size: 1.4rem;">
            <i class="bi bi-cup-straw"></i>
          </span>
          <h2 class="fw-bold text-dark mb-1">Welcome Back</h2>
          <p class="text-muted small">Log in to your LOOZY account for fast ordering & past history</p>
        </div>

        <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small text-secondary">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0 py-2" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 py-2" id="password" name="password" placeholder="Enter your password" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
              <label class="form-check-label small text-secondary" for="remember">Remember me</label>
            </div>
          </div>

          <button type="submit" class="btn btn-loozy-primary w-100 py-3 fs-6 fw-bold shadow">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>

        <!-- Demo credentials helper -->
        <div class="p-3 rounded-3 bg-light border mt-4 small text-secondary">
          <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle text-success me-1"></i> Quick Demo Login:</div>
          <div>Customer: <code>customer@loozy.com</code> / <code>customer123</code></div>
        </div>

        <div class="text-center mt-4 pt-3 border-top small text-secondary">
          Don't have an account yet? 
          <a href="{{ url_for('auth.register') }}" class="text-success fw-bold">Sign Up Now</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
